<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create an account')}"></head>
<body class="auth-body">
<main class="auth">
  <aside th:replace="~{fragments :: authside}"></aside>
  <section class="auth-main">
    <div class="auth-box">
      <h2>Create a student account</h2>
      <p class="sub">We'll email you a link to confirm your address before you can sign in.</p>
      <form th:action="@{/register}" th:object="${registerForm}" method="post" class="stack" novalidate>
        <div class="field" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error'">
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" th:field="*{fullName}" autocomplete="name" maxlength="100" autofocus>
          <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>
        <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
          <label for="email">Email</label>
          <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="190">
          <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
          <label for="password">Password</label>
          <input id="password" type="password" th:field="*{password}" autocomplete="new-password" maxlength="72" aria-describedby="pw-hint">
          <span class="hint" id="pw-hint">At least 8 characters.</span>
          <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p>
    </div>
  </section>
</main>
</body>
</html>
