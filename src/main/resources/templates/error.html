<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body class="auth-body">
<main class="error-page">
  <p class="error-code" th:text="${status}">500</p>
  <h1 th:text="${status == 404} ? 'We couldn\'t find that page' : (${status == 403} ? 'You don\'t have access to this page' : 'Something went wrong on our side')">Something went wrong on our side</h1>
  <p th:if="${status == 404}">The link may be old or mistyped.</p>
  <p th:if="${status == 403}">Sign in with an account that has access to it.</p>
  <p th:unless="${status == 404 or status == 403}">It has been logged. Please try again in a minute.</p>
  <a class="btn btn-primary" th:href="@{/}">Go to Session Scheduler</a>
</main>
</body>
</html>
