<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body>
<div class="shell" id="shell">
  <aside th:replace="~{fragments :: sidebar('account')}"></aside>
  <div class="main">
    <header th:replace="~{fragments :: topbar('Change password')}"></header>
    <main class="content content-narrow">
  <div class="page-head">
    <div>
      <h1>Change password</h1>
      <p class="sub">You'll stay signed in on this device.</p>
    </div>
  </div>
  <th:block th:replace="~{fragments :: flash}"></th:block>
  <section class="card">
    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post" class="stack" novalidate>
      <div class="field" th:classappend="${errors?.get('currentPassword')} ? 'has-error'">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" type="password" th:field="*{currentPassword}" autocomplete="current-password" maxlength="72">
        <span class="field-error" th:if="${errors?.get('currentPassword')}" th:text="${errors?.get('currentPassword')}"></span>
      </div>
      <div class="field" th:classappend="${errors?.get('newPassword')} ? 'has-error'">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" maxlength="72" aria-describedby="np-hint">
        <span class="hint" id="np-hint">At least 8 characters.</span>
        <span class="field-error" th:if="${errors?.get('newPassword')}" th:text="${errors?.get('newPassword')}"></span>
      </div>
      <div class="field" th:classappend="${errors?.get('confirmPassword')} ? 'has-error'">
        <label for="confirmPassword">Repeat new password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" maxlength="72">
        <span class="field-error" th:if="${errors?.get('confirmPassword')}" th:text="${errors?.get('confirmPassword')}"></span>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Update password</button>
        <a class="btn btn-ghost" th:href="@{${home}}">Cancel</a>
      </div>
    </form>
  </section>
</main>
  </div>
</div>
<script th:replace="~{fragments :: shellScript}"></script>
</body>
</html>
